name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  infection:
    name: Infection
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          ini-values: date.timezone=UTC
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/infection --threads=max --no-progress --show-mutations

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infection-logs
          path: |
            infection.log
            infection-summary.log
