name: CI

on:
  push:
    branches: [master, 1.x]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, ${{ matrix.timezone }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        # 库的所有计算固定按 Asia/Shanghai 进行，测试矩阵覆盖多个默认时区以防回归
        timezone: ['UTC', 'Asia/Shanghai', 'America/New_York']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: date.timezone=${{ matrix.timezone }}
          coverage: none

      - run: composer validate --strict

      - uses: ramsey/composer-install@v4

      - run: vendor/bin/phpunit

  coverage:
    name: Coverage (pcov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          ini-values: date.timezone=UTC
          coverage: pcov

      - uses: ramsey/composer-install@v4

      - run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.clover

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: coverage.clover

  nightly:
    name: PHPUnit (PHP 8.6 nightly, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          ini-values: date.timezone=UTC
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          composer-options: --ignore-platform-req=php+

      - run: vendor/bin/phpunit

  code-style:
    name: Code style (pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@v4

      - run: vendor/bin/pint --test

  phpstan:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@v4

      - run: vendor/bin/phpstan analyse --no-progress
